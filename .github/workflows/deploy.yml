name: Build and deploy

on:
  schedule:
    # Every 30 minutes. Energy-Charts remains the broad fallback source; a
    # Deno-hosted APG cache supplies fresher Austrian data when available.
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

# Let a running deploy finish rather than piling up scheduled runs.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Austrian grid data
        run: python scripts/fetch_data.py

      # GitHub-hosted runners cannot reach transparency.apg.at directly, but
      # the Deno cache in Amsterdam can. The wrapper validates cache freshness
      # and schema, then reuses overlay_apg.py's existing merge logic. Failure
      # is non-fatal: Energy-Charts data remains untouched.
      - name: Overlay fresher APG data from Deno cache
        run: python scripts/run_apg_cache_overlay.py

      # Diagnostic only: report which APG feed currently limits the common
      # timestamp used by the dashboard. Never block a deploy on diagnostics.
      - name: Report APG feed freshness
        continue-on-error: true
        run: python scripts/inspect_apg_cache.py

      # Experimental only. The nowcast is written to site/nowcast.json but the
      # frontend does not consume it yet. This lets us compare the estimate
      # against delayed official APG values before deciding whether to show it.
      - name: Build experimental generation nowcast
        continue-on-error: true
        run: python scripts/build_generation_nowcast.py

      # Restore the previously deployed pending predictions, add the current
      # target once, and score older targets whenever APG actuals have arrived.
      # The resulting history is deployed with the site and becomes the input
      # for the next build, so no mutable GitHub cache or repository commits are
      # needed for experimental backtesting.
      - name: Update generation nowcast backtest
        continue-on-error: true
        run: python scripts/update_nowcast_history.py

      - name: Check the data actually landed
        run: |
          python - <<'PY'
          import json, pathlib, sys
          d = json.loads(pathlib.Path("site/data.json").read_text())
          gen = d["now"]["generation"]
          if gen <= 0:
              sys.exit(f"refusing to publish: generation is {gen}")
          if not d.get("groups"):
              sys.exit("refusing to publish: no generation groups")

          # A load of zero is not a physical reading, so it can only come from
          # a null being filled in somewhere. This shipped once already, on
          # 7 Aug 2026, when available_until covered intervals whose load
          # series was still unpublished. Fail the build rather than draw a
          # country that stopped using electricity.
          series = d["day"]["load"]
          zeros = [i for i, v in enumerate(series) if not v or v <= 0]
          if zeros:
              sys.exit(f"refusing to publish: load is zero at {len(zeros)} "
                       f"of {len(series)} samples (indices {zeros[:5]})")
          if d["now"]["load"] <= 0:
              sys.exit(f"refusing to publish: current load is {d['now']['load']}")

          print(f"ok - {gen:.0f} MW across {len(d['groups'])} groups, "
                f"load {d['now']['load']:.0f} MW, no gaps")
          PY

      # The origin trace costs 32 calls against a rate-limited API, so it runs
      # on its own three-hour cadence rather than on every build. The bucket
      # is the cache key: within the same three-hour window the previous
      # result is restored and the tracer is skipped.
      - name: Three-hour bucket for the origin trace
        id: bucket
        run: echo "key=$(( $(date +%s) / 10800 ))" >> "$GITHUB_OUTPUT"

      - name: Restore the last origin trace
        id: tracecache
        uses: actions/cache@v4
        with:
          path: site/trace.json
          key: trace-${{ steps.bucket.outputs.key }}
          # Falls back to the newest trace from an earlier bucket, so the
          # panel shows slightly stale data instead of vanishing while the
          # new one is computed.
          restore-keys: trace-

      # Never fatal: a failed or missing trace leaves the previous file in
      # place, and the page hides the panel if there is none at all.
      - name: Trace where the power started
        if: steps.tracecache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python scripts/trace_origin.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
