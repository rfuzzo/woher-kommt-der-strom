name: Refresh APG cache

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: apg-cache-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Deno cron cannot reliably reach APG, but the production HTTP timeline
      # in Amsterdam can. Trigger that path from outside the deployment.
      - name: Refresh production cache
        run: |
          curl --fail --silent --show-error --max-time 90 \
            https://woher-kommt-der-strom.rfuzzo.deno.net/apg/refresh
